<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครชมรม</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>สมัครชมรมเขียนcode</h1>
    <p>แบบฝึกหัดฟอร์มสมัครชมรม ใช้ชื่อและอีเมลตัวอย่างในการทดสอบ</p>
  </header>

  <nav>
    <a href="index.html">Profile</a>
    <a href="register.html">Register</a>
  </nav>

  <main>

    <section class="card">
      <h2>แบบฟอร์มสมัครชมรม</h2>

      <p id="submitted" class="form-status">ตรวจสอบช่องบังคับเรียบร้อยแล้ว</p>

      <form action="register.html#submitted" method="get">

        <p>
          <label for="fullname">ชื่อ นามสกุล</label><br>
          <input type="text" id="fullname" required>
        </p>

        <p>
          <label for="email">อีเมล</label><br>
          <input type="email" id="email" required>
        </p>

        <p>ระดับชั้น</p>

        <input type="radio" id="m4" name="grade" value="m4" required>
        <label for="m4">ม.4</label>

        <input type="radio" id="m5" name="grade" value="m5" required>
        <label for="m5">ม.5</label>

        <p>
          <label for="activity">กิจกรรมที่สนใจ</label><br>
          <select id="activity" name="activity" required>
            <option value="">-- เลือกกิจกรรม --</option>
            <option value="web">สร้างเว็บไซต์</option>
            <option value="game">สร้างเกม</option>
          </select>
        </p>

        <p>
          <label for="reason">เหตุผลที่อยากสมัคร</label><br>
          <textarea id="reason"
                    rows="4" cols="30"></textarea>
        </p>

        <button type="submit">สมัคร</button>

      </form>
    </section>
  </main>
  <footer>
    <p><a href="../../index.html">กลับหน้าพอร์ต</a></p>
  </footer>

</body>
</html>
